name: Release

# Build a Linux release binary and attach it to the GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/fancontroller dist/fancontroller
          cp README.md LICENSE install.sh dist/
          tar -czf "fancontroller-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C dist .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fancontroller-*-linux-x86_64.tar.gz
            target/release/fancontroller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Placeholder: Windows .exe job enabled once GUI is ported to wry/WebView2.
  # webkit2gtk does not build on Windows. See README roadmap.
